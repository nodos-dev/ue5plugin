name: Plugin Build

run-name: "${{ github.workflow }} | ${{ github.ref_name }} on R5 ${{ inputs.r5_branch }}"

on:
  workflow_dispatch:
    inputs:
      r5_branch:
        description: 'R5 branch to build against. Dots are stripped to find the checkout folder (5.8 -> 58).'
        required: true
        default: '5.8'
        type: string
      engine_root:
        description: 'Folder that holds the R5 checkouts on the runner'
        required: true
        default: 'D:\CI\zerodensity\Reality\w\R5\R5'
        type: string
      nodos_version:
        description: 'Nodos version to bring into the build workspace'
        required: true
        default: '1.3'
        type: string
      clean:
        description: 'Clean checkout and drop previous build output?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      create_release:
        description: 'Create a GitHub release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      copy_to_share:
        description: 'Copy the package to the network share?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      share_dir:
        description: 'Network share to copy the package to'
        required: false
        default: '\\zdfs20\rnd\NodosLink-Builds'
        type: string

      sign:
        type: boolean
        required: true
        description: 'Sign the plugin binaries'
        default: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: [self-hosted, Windows, X64,  unreal]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}
      # The signing service is installed on the runner and holds the key. It is told
      # which one to use by the profile, and identifies this build by the token, which
      # it reads from here rather than from a command line that would end up in a log.
      SIGNING_SERVICE_CLI_PATH: 'C:/Program Files/Zero Density/Signing Service/signing-cli.exe'
      SIGNING_SERVICE_PROFILE: sslcom-yubikey-prod
      SIGNING_SERVICE_APP_TOKEN: ${{ secrets.SIGNING_SERVICE_APP_TOKEN }}
      NODOS_STORE_ACCESS_TOKEN: ${{ secrets.NODOS_STORE_ACCESS_TOKEN }}
      REALITY_ENGINE_ROOT: ${{ inputs.engine_root }}
      REALITY_ENGINE_BRANCH_INPUT: ${{ inputs.r5_branch }}

    steps:
      - name: Resolve Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engineDir = Join-Path $env:REALITY_ENGINE_ROOT ($env:REALITY_ENGINE_BRANCH_INPUT.Replace('.', ''))
          if (-not (Test-Path $engineDir)) {
            $available = (Get-ChildItem $env:REALITY_ENGINE_ROOT -Directory | Select-Object -ExpandProperty Name) -join ', '
            throw "No R5 checkout at $engineDir. Available: $available"
          }
          # BuildPlugin runs against the engine sources. The installed builds under
          # LocalBuilds carry no rules assemblies, so UBT cannot build plugins with them.
          $runUatPath = Join-Path $engineDir 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path $runUatPath)) {
            throw "No RunUAT.bat at $runUatPath"
          }
          if (-not (Test-Path (Join-Path $engineDir 'Engine\Source'))) {
            throw "$engineDir has no Engine\Source. Plugin builds need an R5 source checkout, not an installed build."
          }
          $pluginBranch = '${{ github.ref_name }}'.Replace('/', '-')
          $buildId = "$pluginBranch.b${{ github.run_number }}"
          "REALITY_ENGINE_DIR=$engineDir"      >> $env:GITHUB_ENV
          "REALITY_RUN_UAT_PATH=$runUatPath"   >> $env:GITHUB_ENV
          "NODOS_LINK_BRANCH=$pluginBranch"    >> $env:GITHUB_ENV
          "NODOS_LINK_BUILD_ID=$buildId"       >> $env:GITHUB_ENV
          Write-Host "Engine   : $engineDir"
          Write-Host "RunUAT   : $runUatPath"
          Write-Host "Build id : $buildId"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_TOKEN || github.token }}
          path: plugin
          clean: ${{ inputs.clean }}

      - name: Ensure Nosman
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nosmanPath = Join-Path '${{ github.workspace }}' 'nosman.exe'
          Invoke-WebRequest -OutFile $nosmanPath `
            -Uri 'https://github.com/nodos-dev/workspace/releases/latest/download/nosman-windows-x86_64.exe'

          "SYSTEM_NOSMAN_PATH=$nosmanPath" >> $env:GITHUB_ENV
          Write-Host "Using nosman at $nosmanPath"
          & $nosmanPath --version

      - name: Setup Nodos Workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The plugin build brings its own Nodos workspace and points the NosmanPath
          # editor setting at it, so the engine does not need one of its own.
          $workspaceDir = Join-Path '${{ github.workspace }}' 'nodos'
          if ('${{ inputs.clean }}' -eq 'true' -and (Test-Path $workspaceDir)) {
            Remove-Item $workspaceDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $workspaceDir | Out-Null
          Copy-Item $env:SYSTEM_NOSMAN_PATH (Join-Path $workspaceDir 'nodos.exe') -Force
          Push-Location $workspaceDir
          try {
            & $env:SYSTEM_NOSMAN_PATH init --reinit
            if ($LASTEXITCODE -ne 0) { throw "nosman init failed with exit code $LASTEXITCODE" }
            & .\nodos.exe get --name nodos --version '${{ inputs.nodos_version }}' -y
            if ($LASTEXITCODE -ne 0) { throw "nosman get failed with exit code $LASTEXITCODE" }
            # The release ships its own nosman, put the downloaded one back.
            Copy-Item $env:SYSTEM_NOSMAN_PATH .\nodos.exe -Force
            & .\nodos.exe rescan --fetch-index
            if ($LASTEXITCODE -ne 0) { throw "nosman rescan failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }

          # UnrealBuildTool reads this last, so it wins over the default the plugin
          # ships. It lives in the engine's Saved folder, which is rewritten per build
          # and never travels into the packaged plugin.
          $editorSettings = Join-Path $env:REALITY_ENGINE_DIR 'Engine\Saved\Config\WindowsEditor\EditorSettings.ini'
          New-Item -ItemType Directory -Force -Path (Split-Path $editorSettings) | Out-Null
          Set-Content -Path $editorSettings -Value @(
            '[/Script/NOSClient.NOSSettings]'
            "NosmanPath=$(Join-Path $workspaceDir 'nodos.exe')"
          )
          "NODOS_WORKSPACE_PATH=$workspaceDir" >> $env:GITHUB_ENV
          Write-Host "Nodos workspace at $workspaceDir"
          Write-Host "NosmanPath written to $editorSettings"

      - name: Resolve Versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:NODOS_WORKSPACE_PATH
          try {
            $nosmanVersion = (& .\nodos.exe --version | Select-Object -First 1)
            $engines = & .\nodos.exe engine list --json | ConvertFrom-Json
            $nodosVersion = (($engines | ForEach-Object { $_.version }) -join ', ')
            if (-not $nodosVersion) { throw "No Nodos engine in $env:NODOS_WORKSPACE_PATH" }
          }
          finally { Pop-Location }

          $engineBranch = (git -C $env:REALITY_ENGINE_DIR branch --show-current | Select-Object -First 1)
          $engineCommit = (git -C $env:REALITY_ENGINE_DIR rev-parse --short HEAD | Select-Object -First 1)
          if (-not $engineBranch) { $engineBranch = 'detached' }

          $pluginVersion = (Get-Content .\plugin\Nodos.uplugin | ConvertFrom-Json).VersionName

          "NODOS_VERSION=$nodosVersion"                >> $env:GITHUB_ENV
          "NOSMAN_VERSION=$nosmanVersion"              >> $env:GITHUB_ENV
          "REALITY_ENGINE_BRANCH=$engineBranch"        >> $env:GITHUB_ENV
          "REALITY_ENGINE_COMMIT=$engineCommit"        >> $env:GITHUB_ENV
          "NODOS_LINK_VERSION=$pluginVersion"          >> $env:GITHUB_ENV
          Write-Host "Nodos Link : $pluginVersion"
          Write-Host "Nodos      : $nodosVersion"
          Write-Host "Nosman     : $nosmanVersion"
          Write-Host "R5         : $engineBranch ($engineCommit)"

      - name: Build Plugin
        shell: pwsh
        working-directory: plugin
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path '${{ github.workspace }}' 'package'
          if (Test-Path $packageDir) { Remove-Item $packageDir -Recurse -Force }
          if ('${{ inputs.clean }}' -eq 'true') {
            foreach ($dir in '.\Binaries', '.\Intermediate') {
              if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            }
          }
          $pluginFile = (Resolve-Path .\Nodos.uplugin).Path
          & $env:REALITY_RUN_UAT_PATH BuildPlugin "-Plugin=$pluginFile" "-Package=$packageDir" -NoTargetPlatforms
          if ($LASTEXITCODE -ne 0) { throw "BuildPlugin failed with exit code $LASTEXITCODE" }
          "NODOS_LINK_PACKAGE_DIR=$packageDir" >> $env:GITHUB_ENV

      - name: Sign Plugin
        if: inputs.sign
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # What BuildPlugin compiled. Signed before it is zipped, since the zip is
          # what ships and nothing downstream opens it again.
          $dir = Join-Path $env:NODOS_LINK_PACKAGE_DIR 'Binaries/Win64'
          $files = @(Get-ChildItem $dir -File -Recurse -Include '*.dll', '*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "No binaries to sign under $dir" }
          foreach ($f in $files) {
            $out = & $env:SIGNING_SERVICE_CLI_PATH sign --profile $env:SIGNING_SERVICE_PROFILE --file $f.FullName 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $out -notmatch '"status"\s*:\s*"signed"') {
              throw "Failed to sign $($f.Name): $($out.Trim())"
            }
            Write-Host "  signed $($f.Name)"
          }
          Write-Host "Signed $($files.Count) file(s)"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # BuildPlugin rewrites the descriptor on its way into the package and drops
          # EnabledByDefault while doing it, so put back what the plugin declares.
          $packagedDescriptor = Join-Path $env:NODOS_LINK_PACKAGE_DIR 'Nodos.uplugin'
          $declared = (Get-Content .\plugin\Nodos.uplugin -Raw | ConvertFrom-Json).EnabledByDefault
          $packaged = Get-Content $packagedDescriptor -Raw | ConvertFrom-Json
          $packaged | Add-Member -NotePropertyName 'EnabledByDefault' -NotePropertyValue $declared -Force
          $packaged | ConvertTo-Json -Depth 20 | Set-Content $packagedDescriptor
          Write-Host "EnabledByDefault=$declared in the packaged descriptor"

          $packageZip = Join-Path '${{ github.workspace }}' "nodos-link-$env:NODOS_LINK_BUILD_ID.zip"
          if (Test-Path $packageZip) { Remove-Item $packageZip -Force }
          # Sources ship with the plugin, debug symbols and build leftovers do not.
          7z a -bsp1 -tzip $packageZip (Join-Path $env:NODOS_LINK_PACKAGE_DIR '*') '-xr!*.pdb' '-xr!Intermediate'
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          "NODOS_LINK_PACKAGE_ZIP=$packageZip" >> $env:GITHUB_ENV
          Write-Host "Packaged Nodos Link $env:NODOS_LINK_VERSION to $packageZip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodos-link-${{ env.NODOS_LINK_BUILD_ID }}
          path: ${{ env.NODOS_LINK_PACKAGE_ZIP }}
          if-no-files-found: error

      - name: Copy to Share
        if: ${{ inputs.copy_to_share == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetDir = Join-Path '${{ inputs.share_dir }}' $env:NODOS_LINK_BRANCH
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item $env:NODOS_LINK_PACKAGE_ZIP -Destination $targetDir -Force
          Write-Host "Copied to $targetDir"

      - name: Create Release
        if: ${{ inputs.create_release == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @(
            "## Component List"
            "| Component | Version |"
            "|:----------|:--------|"
            "| Nodos Link | $env:NODOS_LINK_VERSION (``${{ github.sha }}``) |"
            "| Nodos | $env:NODOS_VERSION |"
            "| Nosman | $env:NOSMAN_VERSION |"
            "| R5 Engine | $env:REALITY_ENGINE_BRANCH (``$env:REALITY_ENGINE_COMMIT``) |"
            ""
            "## Code changes"
          ) -join "`r`n"
          gh release create $env:NODOS_LINK_BUILD_ID `
            --repo ${{ github.repository }} `
            --target ${{ github.sha }} `
            --title "Nodos Link $env:NODOS_LINK_VERSION ($env:NODOS_LINK_BUILD_ID)" `
            --notes $notes `
            --generate-notes `
            --latest=false
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          gh release upload $env:NODOS_LINK_BUILD_ID $env:NODOS_LINK_PACKAGE_ZIP --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
